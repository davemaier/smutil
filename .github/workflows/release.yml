name: Release

on:
  push:
    branches:
      - main
      - alpha
      - beta

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

  publish:
    name: Publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get tag version
        id: tag_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package versions
        run: |
          VERSION="${{ steps.tag_version.outputs.version }}"
          # Find all package.json files in packages directory
          find packages -name package.json | while read pkgjson; do
            # Update version using jq
            jq --arg v "$VERSION" '.version = $v' "$pkgjson" > temp.json
            mv temp.json "$pkgjson"
            echo "Updated $pkgjson to version $VERSION"
          done

      - name: Commit version updates
        run: |
          git config --global user.name "David Maier"
          git config --global user.email "david@davidmaier.at"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git remote set-url origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add packages/*/package.json
          git commit -m "chore: release ${{ steps.tag_version.outputs.version }}"
          git push

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          find packages -name package.json | while read pkgjson; do
            pkgdir=$(dirname "$pkgjson")
            # Get actual package name from package.json
            pkg_name=$(jq -r .name "$pkgjson")
            # Skip private packages
            private=$(jq -r .private "$pkgjson")
            
            if [ "$private" != "true" ] && [ "$pkg_name" != "null" ]; then
              echo "Publishing $pkg_name from $pkgdir"
              npm publish "$pkgdir"
            fi
          done
